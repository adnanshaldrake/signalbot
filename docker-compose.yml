version: "3.9"

services:
  signalbot:
    build: .
    container_name: signalbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist SQLite data outside the container
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
